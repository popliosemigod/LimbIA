; =====================================================================
;  LimbIA - mao de 5 servos (versao antiga, visao computacional)
;
;  Projeto SEPARADO do firmware da protese (a raiz do repositorio).
;  Um servo por dedo num Arduino Mega 2560. Um botao troca o gesto;
;  pela serial a mesma mao aceita o quadro "$PIMAM" do cvzone, para ser
;  controlada depois pela camera (Python + cvzone.HandDetector).
;
;  Compilar e gravar, DE DENTRO DESTA PASTA:
;    pio run -t upload
;    pio device monitor
; =====================================================================
[env:megaatmega2560]
platform  = atmelavr @ ^5.0.0
board     = megaatmega2560
framework = arduino

; 9600: o mesmo baud do cvzone.SerialObject("COMx", 9600, 1) do exemplo.
monitor_speed = 9600

lib_deps =
    arduino-libraries/Servo @ ^1.2.2
