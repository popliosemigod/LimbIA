; =====================================================================
;  LimbIA - mao robotica e ortese
;  Layout padrao PlatformIO: src/ include/ lib/ test/
;
;  Ambiente     Placa          Para que serve
;  -----------  -------------  --------------------------------------
;  esp32dev     DevKit V1      a mao: sete juntas, corrente, console
;  bancada      DevKit V1      a mesma, com log detalhado, para calibrar
;  autoteste    DevKit V1      exercita limbia_mao sem nada ligado
;
;  Por que a DevKit V1 e nao o C3 SuperMini que o caderno cita: sao os
;  sensores de corrente que mandam. Cada ACS712 ocupa um canal de ADC1, e
;  na DevKit V1 o ADC1 expoe exatamente SEIS canais (32, 33, 34, 35, 36 e
;  39) - quatro correntes, o EMG e uma reserva. O C3 tem cinco, e o unico
;  da bancada ja esta no FarmIO. Detalhe em docs/02-hardware-e-pinagem.md.
;
;  Compilar tudo:  pio run
;  Gravar a mao:   pio run -e esp32dev -t upload
;  Autoteste:      pio run -e autoteste -t upload
;  Monitorar:      pio device monitor -b 115200
; =====================================================================

[platformio]
default_envs = esp32dev

[env]
platform  = espressif32 @ ^6.9.0
framework = arduino
board     = esp32dev

monitor_speed = 115200
upload_speed  = 921600

; esp32_exception_decoder traduz o backtrace de um panic em arquivo:linha.
; Sem ele, uma excecao vira endereco hexadecimal puro.
monitor_filters =
    esp32_exception_decoder
    time

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DLIMBIA_NOME='"limbia-01"'
    -DLIMBIA_VERSAO='"0.1.0"'

; Versoes fixas de proposito: firmware que compila hoje precisa compilar
; igual daqui a seis meses, na maquina de outra pessoa e no CI.
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2

; ---------------------------------------------------------------------
;  A MAO
; ---------------------------------------------------------------------
[env:esp32dev]
build_src_filter = +<*> -<main_autoteste.cpp>

; ---------------------------------------------------------------------
;  BANCADA - a mesma mao com log detalhado. E aqui que se calibram os
;  limiares de corrente e os pulsos de cada junta.
; ---------------------------------------------------------------------
[env:bancada]
build_type = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DLIMBIA_BANCADA=1
build_src_filter = +<*> -<main_autoteste.cpp>

; ---------------------------------------------------------------------
;  AUTOTESTE - roda na placa nua, sem PCA9685, sem servo e sem sensor.
;  Exercita a matematica de pulso, a tabela de gestos, o classificador de
;  preensao e o diagnostico de tendao frouxo, e imprime os numeros.
;  Ver docs/04-propriocepcao.md.
; ---------------------------------------------------------------------
[env:autoteste]
; Sem lib_deps: o autoteste nao toca em servo nenhum, entao nao precisa
; do driver do PCA9685 - e arrastar a Adafruit BusIO junto so traria a
; dependencia de SPI.h para um binario que nunca fala em SPI.
lib_deps =
build_flags =
    ${env.build_flags}
    -DLIMBIA_AUTOTESTE=1
build_src_filter = +<main_autoteste.cpp>

; ---------------------------------------------------------------------
;  AUTOTESTE NO C3 - o mesmo teste, compilado para a placa que ESTA na
;  bancada hoje (um ESP32-C3, emprestado do FarmIO).
;
;  A mao vai rodar na DevKit V1; este ambiente existe so para que o
;  autoteste possa ser EXECUTADO enquanto a DevKit nao chega na mesa.
;  Como ele e logica pura, o resultado vale para as duas placas - e
;  medir num microcontrolador de verdade e o que separa "deve funcionar"
;  de "funciona".
; ---------------------------------------------------------------------
[env:autoteste_c3]
board = esp32-c3-devkitm-1
lib_deps =
build_flags =
    ${env.build_flags}
    -DLIMBIA_AUTOTESTE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<main_autoteste.cpp>

; ---------------------------------------------------------------------
;  A biblioteca compartilhada do laboratorio (jaspa-core) ainda NAO e
;  usada aqui, pelo mesmo motivo do FarmIO: ela mora no repositorio
;  Jaspy, que e privado, e o caminho por symlink depende do layout de
;  pastas da maquina - o CI deste repositorio nao conseguiria resolver.
;
;  Para desenvolver localmente com ela, com o Jaspy clonado ao lado:
;    lib_deps = symlink://../Jaspy-main/firmware/jaspa-core
; ---------------------------------------------------------------------
