; =====================================================================
;  LimbIA - mao robotica e ortese
;  Layout padrao PlatformIO: src/ include/ lib/ test/
;
;  DUAS PLACAS NA PROTESE
;
;  Ambiente     Placa          Para que serve
;  -----------  -------------  --------------------------------------
;  esp32dev     DevKit V1      a MAO: sete juntas, corrente, console
;  emg          DevKit V1      o EMG: dois eletrodos, a IA, a tela de
;                              ajuste e a rede da protese
;  bancada      DevKit V1      a mao com log detalhado, para calibrar
;  autoteste    DevKit V1      exercita limbia_mao sem nada ligado
;  autoteste_c3 ESP32-C3       o mesmo, na placa que esta na bancada
;  mao_ota      DevKit V1      grava a mao pela rede, sem USB
;  emg_ota      DevKit V1      grava o EMG pela rede, sem USB
;
;  Por que a DevKit V1 e nao o C3 SuperMini que o caderno cita: sao os
;  sensores de corrente que mandam. Cada ACS712 ocupa um canal de ADC1, e
;  na DevKit V1 o ADC1 expoe exatamente SEIS canais (32, 33, 34, 35, 36 e
;  39). Detalhe em docs/02-hardware-e-pinagem.md.
;
;  Compilar:       pio run                        (mao e autoteste; emg em construcao)
;  Gravar por USB: pio run -e esp32dev -t upload  (SEMPRE com -e)
;                  pio run -e emg -t upload
;  Gravar por OTA: pio run -e mao_ota -t upload   (PC na rede da protese,
;                  pio run -e emg_ota -t upload    protese em modo ajuste)
;  Monitorar:      pio device monitor -b 115200
; =====================================================================

[platformio]
; `pio run -t upload` sem -e gravaria todos na mesma porta, um depois do
; outro - por isso a gravacao e sempre com -e.
;
; EM CONSTRUCAO: o ambiente `emg` ainda nao entra aqui porque falta o
; src/main_emg.cpp (os modulos da placa ja existem em include/emg_*.h e
; include/painel*.h). Quando ele existir: default_envs = esp32dev, emg, autoteste
default_envs = esp32dev, autoteste

[env]
platform  = espressif32 @ ^6.9.0
framework = arduino
board     = esp32dev

monitor_speed = 115200
upload_speed  = 921600

; esp32_exception_decoder traduz o backtrace de um panic em arquivo:linha.
; Sem ele, uma excecao vira endereco hexadecimal puro.
monitor_filters =
    esp32_exception_decoder
    time

build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DLIMBIA_NOME='"limbia-01"'
    -DLIMBIA_VERSAO='"0.2.0"'

; Versoes fixas de proposito: firmware que compila hoje precisa compilar
; igual daqui a seis meses, na maquina de outra pessoa e no CI.
;
; Rede, tela, OTA e enlace usam SO bibliotecas do proprio core do ESP32
; (WiFi, WebServer, DNSServer, ArduinoOTA, Preferences). Nenhuma
; dependencia nova - e nenhuma versao a mais para fixar.
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library @ ^3.0.2

; ---------------------------------------------------------------------
;  A MAO
; ---------------------------------------------------------------------
[env:esp32dev]
build_src_filter = +<main.cpp>

; ---------------------------------------------------------------------
;  O EMG - segunda placa. Nao toca em servo: sem driver do PCA9685.
;  EM CONSTRUCAO: ainda nao compila (falta src/main_emg.cpp).
; ---------------------------------------------------------------------
[env:emg]
lib_deps =
build_src_filter = +<main_emg.cpp>

; ---------------------------------------------------------------------
;  BANCADA - a mesma mao com log detalhado. E aqui que se calibram os
;  limiares de corrente e os pulsos de cada junta.
; ---------------------------------------------------------------------
[env:bancada]
build_type = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DLIMBIA_BANCADA=1
build_src_filter = +<main.cpp>

; ---------------------------------------------------------------------
;  OTA - as mesmas duas placas, gravadas pela rede da protese.
;
;  1. PC conectado a rede da protese (o nome que o cliente escolheu);
;  2. protese em MODO AJUSTE - em modo padrao as duas placas recusam
;     firmware novo, porque gravar desliga os servos;
;  3. pio run -e mao_ota -t upload   (ou emg_ota)
;
;  A senha sai de include/secrets.h, a mesma que foi compilada no
;  firmware (scripts/ota_senha.py). IPs fixos: ver include/config_rede.h.
; ---------------------------------------------------------------------
[env:mao_ota]
extends          = env:esp32dev
upload_protocol  = espota
upload_port      = 192.168.4.200
extra_scripts    = post:scripts/ota_senha.py

[env:emg_ota]
extends          = env:emg
upload_protocol  = espota
upload_port      = 192.168.4.1
extra_scripts    = post:scripts/ota_senha.py

; ---------------------------------------------------------------------
;  AUTOTESTE - roda na placa nua, sem PCA9685, sem servo e sem sensor.
;  Exercita a matematica de pulso, a tabela de gestos, o classificador de
;  preensao, o diagnostico de tendao frouxo e - da secao [6] em diante -
;  toda a cadeia do EMG contra um usuario sintetico, e o enlace.
;  Ver docs/04-propriocepcao.md e docs/05-emg-rede-e-ota.md.
; ---------------------------------------------------------------------
[env:autoteste]
; Sem lib_deps: o autoteste nao toca em servo nenhum, entao nao precisa
; do driver do PCA9685 - e arrastar a Adafruit BusIO junto so traria a
; dependencia de SPI.h para um binario que nunca fala em SPI.
lib_deps =
build_flags =
    ${env.build_flags}
    -DLIMBIA_AUTOTESTE=1
build_src_filter = +<main_autoteste.cpp>

; ---------------------------------------------------------------------
;  AUTOTESTE NO C3 - o mesmo teste, compilado para a placa que ESTA na
;  bancada hoje (um ESP32-C3, emprestado do FarmIO).
;
;  A mao vai rodar na DevKit V1; este ambiente existe so para que o
;  autoteste possa ser EXECUTADO enquanto a DevKit nao chega na mesa.
;  Como ele e logica pura, o resultado vale para as duas placas - e
;  medir num microcontrolador de verdade e o que separa "deve funcionar"
;  de "funciona". O C3 nao tem FPU: a secao de EMG roda mais devagar
;  nele, e o custo medido nao vale para a DevKit.
; ---------------------------------------------------------------------
[env:autoteste_c3]
board = esp32-c3-devkitm-1
lib_deps =
build_flags =
    ${env.build_flags}
    -DLIMBIA_AUTOTESTE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<main_autoteste.cpp>

; ---------------------------------------------------------------------
;  A biblioteca compartilhada do laboratorio (jaspa-core) ainda NAO e
;  usada aqui, pelo mesmo motivo do FarmIO: ela mora no repositorio
;  Jaspy, que e privado, e o caminho por symlink depende do layout de
;  pastas da maquina - o CI deste repositorio nao conseguiria resolver.
;
;  Para desenvolver localmente com ela, com o Jaspy clonado ao lado:
;    lib_deps = symlink://../Jaspy-main/firmware/jaspa-core
; ---------------------------------------------------------------------
